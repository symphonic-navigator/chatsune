# Capability overrides per (adapter_type, model_id pattern).
# Matched in order; first match wins. Patterns use fnmatch semantics.
# Adapter heuristics are consulted only when no entry matches.

models:
  # Anthropic Claude family via OpenRouter
  #
  # NOTE (2026-05-09): Effort buckets deliberately omitted for Claude
  # via OpenRouter / nano-gpt — see INS-037. Router translators clobber
  # reasoning.max_tokens when cache_control markers are present, and
  # cache_control is too valuable to drop on every reasoning turn.
  # Reasoning stays as a simple on/off toggle; Sonnet's adaptive
  # default-effort handles the depth choice intelligently. Will revisit
  # once a native Anthropic adapter ships (separate spec).
  - adapter: openrouter_http
    pattern: "anthropic/claude-haiku-4.5*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: openrouter_http
    pattern: "anthropic/claude-sonnet-4.5*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: openrouter_http
    pattern: "anthropic/claude-sonnet-4.6*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: openrouter_http
    pattern: "anthropic/claude-opus-4.5"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: openrouter_http
    pattern: "anthropic/claude-opus-4.6*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: openrouter_http
    pattern: "anthropic/claude-opus-4.7*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # Same family via nano-gpt
  - adapter: nano_gpt_http
    pattern: "claude-haiku-4-5*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: nano_gpt_http
    pattern: "claude-sonnet-4-5*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: nano_gpt_http
    pattern: "anthropic/claude-sonnet-4.6*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: nano_gpt_http
    pattern: "claude-opus-4-5*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: nano_gpt_http
    pattern: "anthropic/claude-opus-4.6*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: nano_gpt_http
    pattern: "anthropic/claude-opus-4.7*"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # OpenAI GPT-5 via OpenRouter
  - adapter: openrouter_http
    pattern: "openai/gpt-5*"
    reasoning:
      kind: optional
      effort: { buckets: [minimal, low, medium, high], default_bucket: medium }
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # GPT-5 via nano-gpt
  - adapter: nano_gpt_http
    pattern: "openai/gpt-5*"
    reasoning:
      kind: optional
      effort: { buckets: [minimal, low, medium, high], default_bucket: medium }
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # xAI native — grok-4.3 with configurable reasoning_effort.
  # "Off" path is collapsed into the adapter: reasoning_mode="off"
  # forwards reasoning_effort="none" to xAI; the pop-out buckets stay
  # low/medium/high so the UI doesn't carry a redundant fourth off-path.
  - adapter: xai_http
    pattern: "grok-4.3"
    reasoning:
      kind: optional
      effort: { buckets: [low, medium, high], default_bucket: low }
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # Mistral native — Small 4 und Medium 3.5 mit binärem reasoning_effort
  # (Mistral akzeptiert nur high/none, kein low/medium). Der UI-Toggle
  # mappt direkt auf high (an) / none (aus); kein Bucket-Selector.
  - adapter: mistral_http
    pattern: "mistral-small-4"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: mistral_http
    pattern: "mistral-medium-3-5"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # z.AI GLM-5 family via Ollama Cloud — reasoning toggleable via think:
  # true/false (probed 2026-05-12 against ollama.com/api/chat). Tool calls
  # work in both reasoning modes. No vision support in this family.
  - adapter: ollama_http
    pattern: "glm-5"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: ollama_http
    pattern: "glm-5.1"
    reasoning:
      kind: optional
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  # z.AI GLM-5 family via Novita — reasoning is forced on upstream
  # (probed 2026-05-12: neither reasoning.enabled=false nor
  # chat_template_kwargs.thinking=false suppress reasoning_content).
  # Tool calls work. No vision support in this family.
  - adapter: novita_http
    pattern: "zai-org/glm-5"
    reasoning:
      kind: always_on
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }

  - adapter: novita_http
    pattern: "zai-org/glm-5.1"
    reasoning:
      kind: always_on
      default_on: true
    tools: { supported: true, exclusive_with_reasoning: false }
